<!DOCTYPE html>
<html lang="es">
<body style="background:#F7F7F5; color:#0A0A0A; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding:40px 20px; margin:0;">
  <div style="max-width:500px; margin:0 auto; background:#FFFFFF; border:1px solid #E7E7E4; padding:36px; text-align:center;">
    <h2 style="color:#0A0A0A; font-family:serif; letter-spacing:3px; margin-bottom:12px; font-weight:normal;">DEMO BARBER CLUB</h2>
    <div style="width:40px; height:1px; background:#0A0A0A; margin:0 auto 24px auto;"></div>
    <p style="color:#5C5C58; font-size:14px; line-height:1.6; margin-bottom:24px;">Has solicitado restablecer la contraseña de tu cuenta de cliente.</p>
    <p style="font-size:14px; color:#0A0A0A; margin-bottom:30px;">Haz clic en el siguiente botón para definir una nueva clave de acceso:</p>
    <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block; background:#0A0A0A; color:#FFFFFF; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:2px; padding:14px 28px; text-decoration:none;">
      Restablecer Contraseña
    </a>
    <p style="color:#9A9A95; font-size:12px; margin-top:36px; line-height:1.5;">Si no solicitaste este cambio, puedes ignorar este correo con total tranquilidad.</p>
  </div>
</body>
</html>
